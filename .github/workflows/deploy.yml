name: Deploy to GitHub Pages

on:
  # [开发阶段已注释] 在私有仓库开发阶段禁用 push 自动触发，避免 GitHub Actions 因缺少 Pages 环境产生失败红叉
  # 待项目转为 Public 并开启 GitHub Pages 后，取消下方 2 行注释即可恢复自动构建与部署
  # push:
  #   branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # [开发阶段已注释] 待仓库转为 Public 后取消以下注释
